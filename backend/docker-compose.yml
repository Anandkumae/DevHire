services:
  db:
    image: postgres:16
    container_name: devhire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhire_user
      POSTGRES_PASSWORD: devhire_local_password
      POSTGRES_DB: devhire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhire_user -d devhire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devhire_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
