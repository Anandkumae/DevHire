name: DevHire CI/CD Pipeline

on:
  push:
    branches: [main, staging]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend Pytest Suite & DB Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devhire_user
          POSTGRES_PASSWORD: devhire_local_password
          POSTGRES_DB: devhire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Database Migrations Up-to-Date
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://devhire_user:devhire_local_password@localhost:5432/devhire_db"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          alembic upgrade head

      - name: Execute Pytest Suite (46 Automated Tests)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://devhire_user:devhire_local_password@localhost:5432/devhire_db"
          REDIS_URL: "redis://localhost:6379/0"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
          SECRET_KEY: "ci_pipeline_secure_test_key_for_devhire"
        run: |
          python -m pytest app/tests -v -p no:locust --durations=10

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "https://api.devhire.app"
        run: npm run build

  docker-build:
    name: Build & Version Docker Images
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            devhire-api:latest
            devhire-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging Environment
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.devhire.app
    steps:
      - name: Deploy Staging Workloads
        run: |
          echo "Deploying release ${{ github.sha }} to DevHire Staging..."
          echo "Health check target: https://staging-api.devhire.app/health/ready"

  deploy-production:
    name: Deploy to Production Environment
    needs: docker-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://devhire.app
    steps:
      - name: Deploy Production Workloads (Blue/Green)
        run: |
          echo "Initiating Blue/Green Zero-Downtime Deployment for ${{ github.ref_name }}..."
          echo "Running database schema migrations..."
          echo "Swapping ALB target groups upon healthy readiness probe response..."
