name: DevHire CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Pytest Suite & DB Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stop host PostgreSQL service (prevent port 5432 collision)
        run: |
          sudo systemctl stop postgresql || true
          sudo systemctl disable postgresql || true

      - name: Spin Up PostgreSQL and Redis via Docker Compose
        run: |
          docker compose up -d db redis
          echo "Waiting for PostgreSQL to be healthy..."
          docker compose exec -T db sh -c 'until pg_isready -U devhire_user -d devhire_db; do sleep 1; done'
          echo "Waiting for Redis to be healthy..."
          docker compose exec -T redis redis-cli ping

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://devhire_user:devhire_local_password@127.0.0.1:5432/devhire_db"
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          alembic upgrade head

      - name: Execute Full Pytest Suite (46 Tests)
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://devhire_user:devhire_local_password@127.0.0.1:5432/devhire_db"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          CELERY_BROKER_URL: "redis://127.0.0.1:6379/0"
          CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/1"
          SECRET_KEY: "ci_pipeline_secure_test_key_for_devhire"
        run: |
          python -m pytest app/tests -v -p no:locust --durations=10

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "https://api.devhire.app"
        run: npm run build

  docker-build:
    name: Build Docker Images
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            devhire-api:latest
            devhire-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
